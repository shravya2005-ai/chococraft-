<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-chococraft sticky-top">
    <div class="container">
        <a class="navbar-brand navbar-brand-logo d-flex align-items-center" th:href="@{/}">
            <i class="fa-solid fa-cookie-bite me-2"></i>
            <span th:text="${storeName}">ChocoCraft</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#chococraftNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="chococraftNavbar">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link nav-link-choco" th:href="@{/}"><i class="fa-solid fa-house me-1"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-choco" th:href="@{/shop}"><i class="fa-solid fa-store me-1"></i> Shop Chocolates</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-choco" th:href="@{/gift-box}"><i class="fa-solid fa-gift me-1"></i> Build Gift Box</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-choco" th:href="@{/about}"><i class="fa-solid fa-heart me-1"></i> Our Story</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-choco" th:href="@{/contact}"><i class="fa-solid fa-envelope me-1"></i> Contact Us</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Cart Icon -->
                <a th:href="@{/cart}" class="btn btn-outline-light position-relative me-2 border-0">
                    <i class="fa-solid fa-basket-shopping fs-5 text-warning"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill cart-badge"
                          th:text="${cartItemCount}">0</span>
                </a>

                <!-- User Account Dropdown -->
                <th:block th:if="${currentUser != null}">
                    <div class="dropdown">
                        <button class="btn btn-choco-primary dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                            <i class="fa-solid fa-user-circle fs-5"></i>
                            <span th:text="${currentUser.fullName}">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item" th:href="@{/orders}"><i class="fa-solid fa-box-archive me-2 text-primary"></i> My Orders</a></li>
                            <li th:if="${isAdmin}"><hr class="dropdown-divider"></li>
                            <li th:if="${isAdmin}">
                                <a class="dropdown-item fw-bold text-danger" th:href="@{/admin/dashboard}">
                                    <i class="fa-solid fa-user-shield me-2"></i> Admin Dashboard
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </th:block>

                <!-- Guest Login / Register Buttons -->
                <th:block th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-choco-outline me-2"><i class="fa-solid fa-right-to-bracket me-1"></i> Login</a>
                    <a th:href="@{/register}" class="btn btn-choco-primary"><i class="fa-solid fa-user-plus me-1"></i> Register</a>
                </th:block>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
