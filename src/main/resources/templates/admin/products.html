<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Product Management')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('products')}"></div>
        </div>

        <!-- Main Body -->
        <div class="col-lg-10 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="brand-font fw-bold">Product Management</h2>
                <a th:href="@{/admin/products/new}" class="btn btn-choco-primary"><i class="fa-solid fa-plus me-1"></i> Add New Product</a>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productPage.content}">
                                <td th:text="${p.id}">1</td>
                                <td><img th:src="${p.imageUrl}" alt="Img" class="rounded" style="width: 50px; height: 50px; object-fit: cover;"></td>
                                <td>
                                    <strong th:text="${p.name}">Product Name</strong>
                                    <span class="d-block small text-muted" th:text="${p.weight}">Weight</span>
                                </td>
                                <td th:text="${p.category != null ? p.category.name : 'Uncategorized'}">Category</td>
                                <td class="fw-bold" th:text="'₹' + ${p.price}">₹199</td>
                                <td>
                                    <span th:classappend="${p.stockQuantity < 10} ? 'badge bg-danger' : 'badge bg-success'" th:text="${p.stockQuantity}">15</span>
                                </td>
                                <td>
                                    <span th:if="${p.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${p.active}" class="badge bg-secondary">Inactive</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-pen-to-square"></i></a>
                                        <form th:action="@{/admin/products/toggle-status/{id}(id=${p.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary ms-1" th:title="${p.active ? 'Deactivate' : 'Activate'}">
                                                <i class="fa-solid" th:classappend="${p.active ? 'fa-toggle-on text-success' : 'fa-toggle-off text-muted'}"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
