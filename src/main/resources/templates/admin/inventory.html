<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Inventory Management')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('inventory')}"></div>
        </div>

        <div class="col-lg-10 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <h2 class="brand-font fw-bold mb-4">Inventory & Stock Management</h2>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Current Stock</th>
                                <th>Stock Status</th>
                                <th>Update Stock</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${products}">
                                <td class="fw-bold" th:text="${p.name}">Name</td>
                                <td th:text="${p.category != null ? p.category.name : 'Chocolates'}">Category</td>
                                <td th:text="'₹' + ${p.price}">₹199</td>
                                <td>
                                    <span class="fs-6 fw-bold" th:text="${p.stockQuantity}">10</span>
                                </td>
                                <td>
                                    <span th:if="${p.stockQuantity == 0}" class="badge bg-danger">OUT OF STOCK</span>
                                    <span th:if="${p.stockQuantity > 0 and p.stockQuantity <= 10}" class="badge bg-warning text-dark">LOW STOCK</span>
                                    <span th:if="${p.stockQuantity > 10}" class="badge bg-success">IN STOCK</span>
                                </td>
                                <td>
                                    <form th:action="@{/admin/inventory/update}" method="post" class="d-flex align-items-center gap-2" style="max-width: 220px;">
                                        <input type="hidden" name="productId" th:value="${p.id}">
                                        <input type="number" class="form-control form-control-sm text-center fw-bold" name="stockQuantity" th:value="${p.stockQuantity}" min="0">
                                        <button type="submit" class="btn btn-sm btn-outline-dark"><i class="fa-solid fa-check"></i> Save</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
