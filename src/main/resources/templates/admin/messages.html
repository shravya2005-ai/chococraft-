<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Customer Inquiries')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('messages')}"></div>
        </div>

        <div class="col-lg-10 p-4">
            <h2 class="brand-font fw-bold mb-4">Customer Contact Inquiries</h2>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Sender</th>
                                <th>Subject</th>
                                <th>Message</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="msg : ${messages}">
                                <td th:text="${#temporals.format(msg.sentAt, 'dd MMM yyyy, hh:mm a')}">Date</td>
                                <td>
                                    <div class="fw-bold" th:text="${msg.name}">Name</div>
                                    <span class="small text-muted" th:text="${msg.email}">email</span>
                                </td>
                                <td class="fw-bold" th:text="${msg.subject}">Subject</td>
                                <td th:text="${msg.message}">Message content</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
