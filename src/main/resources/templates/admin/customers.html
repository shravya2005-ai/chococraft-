<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Customer Management')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('customers')}"></div>
        </div>

        <div class="col-lg-10 p-4">
            <h2 class="brand-font fw-bold mb-4">Registered Customers</h2>

            <div class="card border-0 shadow-sm p-4">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Registered Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${customers}">
                                <td th:text="${c.id}">1</td>
                                <td class="fw-bold" th:text="${c.fullName}">Name</td>
                                <td th:text="${c.email}">Email</td>
                                <td th:text="${c.phone}">Phone</td>
                                <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <span th:if="${c.active}" class="badge bg-success">Active</span>
                                    <span th:unless="${c.active}" class="badge bg-danger">Disabled</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
