<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Admin Topbar Navbar -->
<nav th:fragment="admin-topbar" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand brand-font text-warning fw-bold fs-4" th:href="@{/admin/dashboard}">
            <i class="fa-solid fa-user-shield me-2"></i>ChocoCraft Admin Portal
        </a>

        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/}" class="btn btn-outline-light btn-sm" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i> View Website</a>
            <div class="dropdown">
                <button class="btn btn-choco-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    <i class="fa-solid fa-circle-user me-1"></i> Admin
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i> Sign Out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Admin Sidebar Nav -->
<div th:fragment="admin-sidebar(activePage)" class="admin-sidebar">
    <div class="nav flex-column">
        <a th:href="@{/admin/dashboard}" class="admin-nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a th:href="@{/admin/products}" class="admin-nav-link" th:classappend="${activePage == 'products'} ? 'active'">
            <i class="fa-solid fa-cookie-bite"></i> Products
        </a>
        <a th:href="@{/admin/categories}" class="admin-nav-link" th:classappend="${activePage == 'categories'} ? 'active'">
            <i class="fa-solid fa-layer-group"></i> Categories
        </a>
        <a th:href="@{/admin/orders}" class="admin-nav-link" th:classappend="${activePage == 'orders'} ? 'active'">
            <i class="fa-solid fa-box-archive"></i> Customer Orders
        </a>
        <a th:href="@{/admin/inventory}" class="admin-nav-link" th:classappend="${activePage == 'inventory'} ? 'active'">
            <i class="fa-solid fa-warehouse"></i> Inventory Stock
        </a>
        <a th:href="@{/admin/customers}" class="admin-nav-link" th:classappend="${activePage == 'customers'} ? 'active'">
            <i class="fa-solid fa-users"></i> Customers
        </a>
        <a th:href="@{/admin/messages}" class="admin-nav-link" th:classappend="${activePage == 'messages'} ? 'active'">
            <i class="fa-solid fa-comments"></i> Inquiries
        </a>
    </div>
</div>
</body>
</html>
