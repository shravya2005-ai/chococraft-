<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin Dashboard')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('dashboard')}"></div>
        </div>

        <!-- Main Dashboard Body -->
        <div class="col-lg-10 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="brand-font fw-bold">Dashboard Overview</h2>
                <span class="text-muted small" th:text="'Server Time: ' + ${#temporals.format(#temporals.createNow(), 'dd MMM yyyy, hh:mm a')}">Time</span>
            </div>

            <!-- Metrics Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 bg-white border-start border-4 border-primary">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small fw-bold text-uppercase">Total Sales Revenue</span>
                                <h3 class="fw-bold mb-0 text-dark" th:text="'₹' + ${totalSales}">₹0.00</h3>
                            </div>
                            <div class="bg-primary-subtle text-primary p-3 rounded-circle fs-3"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 bg-white border-start border-4 border-success">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small fw-bold text-uppercase">Total Orders</span>
                                <h3 class="fw-bold mb-0 text-dark" th:text="${totalOrders}">0</h3>
                            </div>
                            <div class="bg-success-subtle text-success p-3 rounded-circle fs-3"><i class="fa-solid fa-box-archive"></i></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 bg-white border-start border-4 border-warning">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small fw-bold text-uppercase">Pending Orders</span>
                                <h3 class="fw-bold mb-0 text-dark" th:text="${pendingOrders}">0</h3>
                            </div>
                            <div class="bg-warning-subtle text-warning p-3 rounded-circle fs-3"><i class="fa-solid fa-clock"></i></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm p-3 bg-white border-start border-4 border-danger">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="text-muted small fw-bold text-uppercase">Low Stock Alert</span>
                                <h3 class="fw-bold mb-0 text-dark" th:text="${lowStockProducts.size()}">0</h3>
                            </div>
                            <div class="bg-danger-subtle text-danger p-3 rounded-circle fs-3"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tables Row -->
            <div class="row g-4">
                <!-- Recent Orders -->
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">Recent Customer Orders</h5>
                            <a th:href="@{/admin/orders}" class="btn btn-outline-dark btn-sm">View All</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle table-hover">
                                <thead>
                                    <tr>
                                        <th>Order #</th>
                                        <th>Customer</th>
                                        <th>Amount</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${recentOrders}">
                                        <td class="fw-bold" th:text="${order.orderNumber}">CC-101</td>
                                        <td th:text="${order.user.fullName}">Customer</td>
                                        <td class="fw-bold" th:text="'₹' + ${order.totalAmount}">₹299</td>
                                        <td><span class="badge bg-info text-dark" th:text="${order.orderStatus.label}">Placed</span></td>
                                        <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-link">Details</a></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Low Stock Products -->
                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0 text-danger"><i class="fa-solid fa-warehouse me-2"></i> Low Stock Warning</h5>
                            <a th:href="@{/admin/inventory}" class="btn btn-outline-danger btn-sm">Manage Inventory</a>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Stock</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="p : ${lowStockProducts}">
                                        <td th:text="${p.name}">Product Name</td>
                                        <td><span class="badge bg-danger fs-6" th:text="${p.stockQuantity}">3</span></td>
                                        <td><a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary">Restock</a></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
