<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Customer Sign In')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white p-4 text-center border-0">
                        <i class="fa-solid fa-cookie-bite fs-1 text-warning mb-2"></i>
                        <h3 class="brand-font text-warning mb-1">Welcome Back</h3>
                        <p class="small text-light-50 mb-0">Sign in to your ChocoCraft account</p>
                    </div>

                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert alert-danger">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> Invalid email or password.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-info">
                            <i class="fa-solid fa-circle-info me-1"></i> You have been signed out safely.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-choco-primary btn-lg w-100 mb-3 fw-bold">Sign In</button>
                        </form>

                        <!-- Demo credentials help box for evaluator -->
                        <div class="p-3 rounded bg-light border small text-muted">
                            <p class="fw-bold mb-1"><i class="fa-solid fa-key text-warning me-1"></i> Demo Credentials:</p>
                            <div>Customer: <code>customer@chococraft.com</code> / <code>Customer@123</code></div>
                            <div>Admin: <code>admin@chococraft.com</code> / <code>Admin@123</code></div>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-0 text-muted">Don't have an account yet? <a th:href="@{/register}" class="fw-bold text-dark text-decoration-none">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
