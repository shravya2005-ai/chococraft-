<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('My Orders')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <h1 class="brand-font display-6 fw-bold mb-4"><i class="fa-solid fa-box-archive me-2 text-warning"></i> My Order History</h1>

        <div th:if="${orders.empty}" class="text-center py-5 bg-white rounded-4 shadow-sm border">
            <i class="fa-solid fa-receipt fs-1 text-muted mb-3"></i>
            <h4>No orders placed yet</h4>
            <p class="text-muted">You haven't ordered any delicious chocolates yet.</p>
            <a th:href="@{/shop}" class="btn btn-choco-primary"><i class="fa-solid fa-store me-2"></i> Browse Shop</a>
        </div>

        <div th:unless="${orders.empty}" class="bg-white rounded-4 shadow-sm p-4 border">
            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Order #</th>
                            <th>Date</th>
                            <th>Total Amount</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td>
                                <strong th:text="${order.orderNumber}">CC-123</strong>
                            </td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a')}">Date</td>
                            <td class="fw-bold" th:text="'₹' + ${order.totalAmount}">₹499</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${order.paymentMethod.label}">COD</span>
                                <span class="badge bg-success ms-1" th:if="${order.paymentStatus.name() == 'COMPLETED'}">Paid</span>
                                <span class="badge bg-secondary ms-1" th:unless="${order.paymentStatus.name() == 'COMPLETED'}" th:text="${order.paymentStatus.label}">Pending</span>
                            </td>
                            <td>
                                <span th:if="${order.orderStatus.name() == 'PLACED'}" class="badge bg-info text-dark">Placed</span>
                                <span th:if="${order.orderStatus.name() == 'CONFIRMED'}" class="badge bg-primary">Confirmed</span>
                                <span th:if="${order.orderStatus.name() == 'PREPARING'}" class="badge bg-warning text-dark">Preparing</span>
                                <span th:if="${order.orderStatus.name() == 'SHIPPED'}" class="badge bg-dark">Shipped</span>
                                <span th:if="${order.orderStatus.name() == 'DELIVERED'}" class="badge bg-success">Delivered</span>
                                <span th:if="${order.orderStatus.name() == 'CANCELLED'}" class="badge bg-danger">Cancelled</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-choco-outline btn-sm"><i class="fa-solid fa-eye me-1"></i> Track Order</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
