server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CHOCO_SESSION

spring:
  application:
    name: ChocoCraft
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:chococraftdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

chococraft:
  store:
    name: ChocoCraft
    tagline: Handmade with Love, Delivered with Happiness.
    contact-email: support@chococraft.com
    contact-phone: +91 98765 43210
    address: 124 Chocolate Avenue, Sweet Delight Quarter, Bengaluru, Karnataka - 560001
    free-delivery-threshold: 499.00
    flat-delivery-charge: 50.00
