<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${product.name})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-muted">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/shop}" class="text-muted">Shop</a></li>
                <li class="breadcrumb-item active" th:text="${product.name}">Product</li>
            </ol>
        </nav>

        <div class="row g-5 align-items-center bg-white rounded-4 shadow-sm p-4 border">
            <!-- Product Image -->
            <div class="col-lg-6 text-center">
                <div class="position-relative overflow-hidden rounded-4 bg-light p-3" style="max-height: 450px;">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}" class="img-fluid rounded-4 shadow" style="max-height: 400px; object-fit: contain;">
                </div>
            </div>

            <!-- Product Info -->
            <div class="col-lg-6">
                <div class="mb-2">
                    <span class="badge bg-warning text-dark me-2" th:text="${product.category != null ? product.category.name : 'Homemade'}">Category</span>
                    <span class="badge bg-success" th:if="${product.stockQuantity > 0}"><i class="fa-solid fa-circle-check me-1"></i> In Stock (<span th:text="${product.stockQuantity}">10</span> available)</span>
                    <span class="badge bg-danger" th:if="${product.stockQuantity == 0}"><i class="fa-solid fa-circle-xmark me-1"></i> Out of Stock</span>
                </div>

                <h1 class="brand-font display-6 fw-bold text-dark mb-2" th:text="${product.name}">Product Name</h1>
                
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="fs-2 fw-bold text-dark" th:text="'₹' + ${product.price}">₹299</span>
                    <span class="text-muted border-start ps-3" th:text="'Net Wt: ' + ${product.weight}">200g</span>
                    <span class="text-warning border-start ps-3"><i class="fa-solid fa-star"></i> <span th:text="${product.rating}">4.9</span> (Rating)</span>
                </div>

                <p class="lead text-muted mb-4" th:text="${product.description}">Product description goes here.</p>

                <!-- Add to Cart Form -->
                <form th:action="@{/cart/add}" method="post" class="mb-4" th:if="${product.stockQuantity > 0}">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="quantity" class="col-form-label fw-bold">Quantity:</label>
                        </div>
                        <div class="col-auto">
                            <input type="number" id="quantity" name="quantity" class="form-control text-center fw-bold" value="1" min="1" th:max="${product.stockQuantity}" style="width: 90px;">
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-choco-primary btn-lg px-4"><i class="fa-solid fa-cart-plus me-2"></i> Add to Cart</button>
                        </div>
                    </div>
                </form>

                <!-- Accordion details -->
                <div class="accordion accordion-flush border-top pt-3" id="productDetailsAccordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseIngredients">
                                <i class="fa-solid fa-leaf me-2 text-success"></i> Ingredients
                            </button>
                        </h2>
                        <div id="collapseIngredients" class="accordion-collapse collapse" data-bs-parent="#productDetailsAccordion">
                            <div class="accordion-body small text-muted" th:text="${product.ingredients}">Ingredients list</div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAllergens">
                                <i class="fa-solid fa-triangle-exclamation me-2 text-warning"></i> Allergen Information
                            </button>
                        </h2>
                        <div id="collapseAllergens" class="accordion-collapse collapse" data-bs-parent="#productDetailsAccordion">
                            <div class="accordion-body small text-muted" th:text="${product.allergenInformation}">Allergen info</div>
                        </div>
                    </div>

                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStorage">
                                <i class="fa-solid fa-snowflake me-2 text-info"></i> Storage Instructions
                            </button>
                        </h2>
                        <div id="collapseStorage" class="accordion-collapse collapse" data-bs-parent="#productDetailsAccordion">
                            <div class="accordion-body small text-muted" th:text="${product.storageInstructions}">Storage info</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products Section -->
        <div class="mt-5" th:if="${relatedProducts != null and !relatedProducts.empty}">
            <h3 class="brand-font fw-bold mb-4">You Might Also Love</h3>
            <div class="row g-4">
                <div th:each="related : ${relatedProducts}" class="col-md-3">
                    <div class="choco-card h-100 p-3">
                        <img th:src="${related.imageUrl}" th:alt="${related.name}" class="img-fluid rounded mb-2" style="height: 140px; object-fit: cover; width: 100%;">
                        <h6 class="fw-bold mb-1"><a th:href="@{/products/{id}(id=${related.id})}" class="text-dark text-decoration-none" th:text="${related.name}">Name</a></h6>
                        <span class="price-tag fs-6" th:text="'₹' + ${related.price}">₹199</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
