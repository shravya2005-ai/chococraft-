<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Category Management')}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('categories')}"></div>
        </div>

        <div class="col-lg-10 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <h2 class="brand-font fw-bold mb-4">Category Management</h2>

            <div class="row g-4">
                <!-- Add Category Form -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3">Add New Category</h5>
                        <form th:action="@{/admin/categories/save}" method="post" th:object="${categoryForm}">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">Category Name *</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold">Description</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="imageUrl" class="form-label fw-bold">Image URL</label>
                                <input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}">
                            </div>
                            <button type="submit" class="btn btn-choco-primary w-100">Save Category</button>
                        </form>
                    </div>
                </div>

                <!-- Categories Table -->
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3">Existing Categories</h5>
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Slug</th>
                                        <th>Products Count</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="cat : ${categories}">
                                        <td th:text="${cat.id}">1</td>
                                        <td class="fw-bold" th:text="${cat.name}">Name</td>
                                        <td th:text="${cat.slug}">slug</td>
                                        <td th:text="${cat.products != null ? cat.products.size() : 0}">0</td>
                                        <td>
                                            <span th:if="${cat.active}" class="badge bg-success">Active</span>
                                            <span th:unless="${cat.active}" class="badge bg-secondary">Inactive</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
