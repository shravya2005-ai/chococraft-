<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${product.id == null ? 'Add Product' : 'Edit Product'})}"></head>
<body class="bg-light">

<div th:replace="~{admin/fragments/admin-layout :: admin-topbar}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-lg-2 p-0">
            <div th:replace="~{admin/fragments/admin-layout :: admin-sidebar('products')}"></div>
        </div>

        <!-- Main Form Body -->
        <div class="col-lg-10 p-4">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="brand-font fw-bold" th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Add Product</h2>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Back to Products</a>
            </div>

            <div class="card border-0 shadow-sm p-4">
                <form th:action="@{/admin/products/save}" method="post" th:object="${product}">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-bold">Product Name *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="price" class="form-label fw-bold">Price (₹) *</label>
                            <input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                        </div>

                        <div class="col-md-3">
                            <label for="stockQuantity" class="form-label fw-bold">Stock Quantity *</label>
                            <input type="number" class="form-control" id="stockQuantity" th:field="*{stockQuantity}" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="categoryId" class="form-label fw-bold">Category</label>
                            <select class="form-select" id="categoryId" name="categoryId">
                                <option value="">Select Category</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category != null and product.category.id == cat.id}">Category</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="weight" class="form-label fw-bold">Weight / Pack Size</label>
                            <input type="text" class="form-control" id="weight" th:field="*{weight}" placeholder="e.g. 200g or 12 Pieces">
                        </div>

                        <div class="col-12">
                            <label for="imageUrl" class="form-label fw-bold">Image URL</label>
                            <input type="text" class="form-control" id="imageUrl" th:field="*{imageUrl}" placeholder="/images/products/dark-classic.jpg or web URL">
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label fw-bold">Product Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="ingredients" class="form-label fw-bold">Ingredients</label>
                            <textarea class="form-control" id="ingredients" th:field="*{ingredients}" rows="2"></textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="allergenInformation" class="form-label fw-bold">Allergen Information</label>
                            <textarea class="form-control" id="allergenInformation" th:field="*{allergenInformation}" rows="2"></textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="storageInstructions" class="form-label fw-bold">Storage Instructions</label>
                            <textarea class="form-control" id="storageInstructions" th:field="*{storageInstructions}" rows="2"></textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-check-inline me-4">
                                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                                <label class="form-check-label fw-bold" for="active">Active (Visible in Store)</label>
                            </div>

                            <div class="form-check form-check-inline me-4">
                                <input class="form-check-input" type="checkbox" id="featured" th:field="*{featured}">
                                <label class="form-check-label fw-bold" for="featured">Featured Product</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="bestseller" th:field="*{bestseller}">
                                <label class="form-check-label fw-bold" for="bestseller">Bestseller Badge</label>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-choco-primary btn-lg px-4"><i class="fa-solid fa-floppy-disk me-2"></i> Save Product</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
